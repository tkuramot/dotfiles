# prefix
unbind C-b
set -g prefix C-q
bind-key C-q send-prefix

# history
set -g history-limit 10000

# focus
set -g focus-events on

# panes
set -wg pane-base-index 1
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -r H resize-pane -L
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R

# windows
set -g base-index 1
set -g renumber-windows on

# copy
set -wg mode-keys vi

bind -T copy-mode-vi 'v' { send -X begin-selection }
bind -T copy-mode-vi 'C-v' { send -X rectangle-toggle }
bind -T copy-mode-vi 'V' { send -X select-line }
bind -T copy-mode-vi 'Escape' { send -X clear-selection }

bind -T copy-mode-vi 'y' { send -X copy-selection }
bind -T copy-mode-vi 'Y' { send -X copy-end-of-line }

# status bar
set -g status-interval 1
set -g status-right ""
set -g default-terminal screen-256color

# theme
# gruvbox light (ANSI colours from alacritty; bg1 is not in the palette)
# alacritty does not report its theme, so detect falls back to dark
set -g theme light
set -g light-theme-black black
set -g light-theme-white brightwhite
set -g light-theme-light-grey brightblack
set -g light-theme-dark-grey "#ebdbb2"
set -g light-theme-green brightgreen
set -g light-theme-yellow brightyellow
set -g light-theme-red brightred
set -g light-theme-blue brightblue
set -g light-theme-cyan brightcyan
set -g light-theme-magenta brightmagenta
set -g tree-mode-border-style bg=themedarkgrey,fg=themewhite
set -g menu-border-style bg=themedarkgrey,fg=themewhite
set -g popup-border-style bg=themedarkgrey,fg=themewhite
set -g display-panes-border-style bg=themedarkgrey,fg=themewhite

if-shell "test -f ~/.config/tmux/tmux.local.conf" "source-file ~/.config/tmux/tmux.local.conf"
